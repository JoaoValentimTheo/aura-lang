name: Fuzz (nightly)

# A longer libFuzzer run of the four hardening targets, scheduled nightly.
# This extends the bounded PR smoke run in `ci.yml` (60 s/target) rather than
# duplicating it. It only runs on a schedule (and on manual dispatch), never on
# a pull request, so it is already decoupled from PR turnaround — and a real
# crash MUST turn this run red rather than being hidden behind
# `continue-on-error` (a nightly run that always looks green cannot signal a
# regression). Crash artifacts are uploaded regardless of outcome.
#
# Supply chain: actions are pinned by version (never `@main`/`@latest`),
# matching the repository's existing policy; the workflow requests only
# `contents: read`.

on:
  schedule:
    # 03:17 UTC daily (off the hour, to avoid the busiest scheduler minute).
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz-nightly:
    name: nightly fuzz (per-target budgets)
    runs-on: ubuntu-latest
    # LeakSanitizer is enabled for the front-end targets and scoped OFF only
    # for `runtime` (see the per-target step): Aura's documented, memory-safe
    # model does not reclaim an `Rc` cycle, so the runtime target legitimately
    # retains cycle memory. Crashes, aborts, and timeouts still fail the job.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: "fuzz -> target"
      - name: Install cargo-fuzz (pinned to the version in fuzz/README.md)
        run: |
          set -euo pipefail
          if ! cargo fuzz --version 2>/dev/null | grep -q 'cargo-fuzz 0.13.2'; then
            cargo install cargo-fuzz --version 0.13.2 --locked
          fi
          cargo fuzz --version
      - name: Seed the working corpora from the committed seeds
        run: |
          set -euo pipefail
          for t in lexer parser checker runtime; do
            mkdir -p "fuzz/corpus/$t"
            cp fuzz/seeds/$t/* "fuzz/corpus/$t/" 2>/dev/null || true
          done
      # Sanitizer scope: ASan always on. LSan on for lexer/parser/checker; off
      # only for runtime, whose cycle retention is expected (§31.6).
      #
      # Per-target budgets: the `runtime` target generates programs that may
      # build a reference cycle, and Aura's documented, memory-safe value model
      # does not reclaim an `Rc` cycle, so each runtime iteration retains its
      # cycle memory in-process. Its budget is therefore shorter, so RSS stays
      # bounded well under the runner's memory; lexer/parser/checker have no
      # such retention and run longer.
      - name: Fuzz front-end targets (30m each, LSan on)
        run: |
          set -euo pipefail
          for t in lexer parser checker; do
            echo "=== fuzzing $t for 1800s (LSan on) ==="
            cargo +nightly fuzz run "$t" -- -max_total_time=1800 -rss_limit_mb=6144 -timeout=25
          done
      - name: Fuzz the runtime target (5m, LSan scoped off)
        run: |
          set -euo pipefail
          echo "=== fuzzing runtime for 300s (LSan scoped off: Rc-cycle retention) ==="
          ASAN_OPTIONS=detect_leaks=0 \
            cargo +nightly fuzz run runtime -- -max_total_time=300 -rss_limit_mb=6144 -timeout=25
      - name: Upload any crash artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fuzz-artifacts
          path: |
            fuzz/artifacts/**
            fuzz/corpus/**
          if-no-files-found: ignore
      - name: Fail if any crash artifact was produced
        if: always()
        run: |
          set -euo pipefail
          # A `slow-unit-*` artifact is a performance signal, not a crash: the
          # generated unit exceeded the per-unit timeout. Nightly still surfaces
          # it (uploaded above and echoed here) but does not conflate it with a
          # crash. Crashes, aborts, and leaks fail the job (CI-RELIABILITY-1).
          if [ -d fuzz/artifacts ]; then
            crashes="$(find fuzz/artifacts -type f ! -name 'slow-unit-*' -print)"
            if [ -n "$crashes" ]; then
              echo "fuzz produced crash artifacts:" >&2
              echo "$crashes" >&2
              exit 1
            fi
            slow="$(find fuzz/artifacts -type f -name 'slow-unit-*' -print)"
            if [ -n "$slow" ]; then
              echo "note: fuzz produced slow-unit signals (performance, not crashes):" >&2
              echo "$slow" >&2
            fi
          fi
          echo "no crash artifacts"

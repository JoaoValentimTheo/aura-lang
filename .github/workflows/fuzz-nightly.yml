name: Fuzz (nightly)

# A longer libFuzzer run of the four hardening targets, scheduled nightly.
# This extends the bounded PR smoke run in `ci.yml` (60 s/target) rather than
# duplicating it. It is intentionally non-blocking for normal PR turnaround:
# it only runs on a schedule (and on manual dispatch), never on a pull request.
#
# Supply chain: actions are pinned by major version (never `@main`/`@latest`),
# matching the repository's existing policy; the workflow requests only
# `contents: read`.

on:
  schedule:
    # 03:17 UTC daily (off the hour, to avoid the busiest scheduler minute).
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz-nightly:
    name: nightly fuzz (30m/target)
    runs-on: ubuntu-latest
    # The scheduled run must not fail the repository's overall health status for
    # an infrastructure hiccup; a crash still uploads artifacts and is visible.
    continue-on-error: true
    # LeakSanitizer is disabled for the whole job (see the note on the fuzz
    # step): Aura's documented, memory-safe model does not reclaim an `Rc`
    # cycle, so the runtime target legitimately retains cycle memory.
    env:
      ASAN_OPTIONS: detect_leaks=0
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "fuzz -> target"
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Seed the working corpora from the committed seeds
        run: |
          set -euo pipefail
          for t in lexer parser checker runtime; do
            mkdir -p "fuzz/corpus/$t"
            cp fuzz/seeds/$t/* "fuzz/corpus/$t/" 2>/dev/null || true
          done
      - name: Fuzz each target (per-target budgets)
        run: |
          set -euo pipefail
          # Per-target budgets. The `runtime` target generates programs that may
          # build a reference cycle, and Aura's documented, memory-safe value
          # model does not reclaim an `Rc` cycle (LANGUAGE_SPEC.md §31.6), so each
          # runtime iteration retains its cycle memory in-process. Its budget is
          # therefore shorter, so RSS stays bounded well under the runner's
          # memory; lexer/parser/checker have no such retention and run longer.
          # LeakSanitizer is disabled for the whole job (see `env`), because that
          # retention is expected, not a leak bug.
          run_target() {
            local t="$1"; local secs="$2"
            echo "=== fuzzing $t for ${secs}s ==="
            cargo fuzz run "$t" -- -max_total_time="$secs" -rss_limit_mb=6144 -timeout=25
          }
          run_target lexer  1800
          run_target parser 1800
          run_target checker 1800
          run_target runtime 300
      - name: Upload any crash artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: |
            fuzz/artifacts/**
            fuzz/corpus/**
          if-no-files-found: ignore
      - name: Fail if any crash artifact was produced
        if: always()
        run: |
          if [ -d fuzz/artifacts ] && [ -n "$(find fuzz/artifacts -type f -print -quit)" ]; then
            echo "fuzz produced crash artifacts:" >&2
            find fuzz/artifacts -type f -print >&2
            exit 1
          fi
          echo "no crash artifacts"

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Build pure-Rust release (no CPython)
        run: >
          cargo build --release --target ${{ matrix.target }}
          --no-default-features --features cli,repl,json,regex,time
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          name="aura-${{ matrix.target }}"
          mkdir -p "dist/$name"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/aura.exe" "dist/$name/"
          else
            cp "target/${{ matrix.target }}/release/aura" "dist/$name/"
          fi
          cp README.md LICENSE "dist/$name/"
          (cd dist && tar czf "$name.tar.gz" "$name")
      - uses: actions/upload-artifact@v4
        with:
          name: aura-${{ matrix.target }}
          path: dist/*.tar.gz

  publish:
    name: publish to crates.io
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo publish --no-default-features --features cli,repl,json,regex,time --dry-run
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true

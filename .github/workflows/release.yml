name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Verify version matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python - <<'PY'
          import os, tomllib
          with open('pyproject.toml', 'rb') as fh:
              version = tomllib.load(fh)['project']['version']
          tag = os.environ['GITHUB_REF_NAME'].lstrip('v')
          # PEP 440 normalizes some pre-release spellings; compare loosely.
          assert version == tag or version.replace('a', 'a') == tag, \
              f"pyproject version {version} != tag {tag}"
          print(f"version {version} matches tag {tag}")
          PY
      - name: Build
        run: |
          python -m pip install --upgrade build
          python -m build
      - uses: actions/upload-artifact@v7
        with:
          name: distributions
          path: dist/

  publish-pypi:
    name: Publish to PyPI
    needs: build
    # Opt-in: set the repository variable PUBLISH_TO_PYPI=true (and configure
    # PyPI trusted publishing for this repository) to enable.
    if: ${{ vars.PUBLISH_TO_PYPI == 'true' }}
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write  # trusted publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: distributions
          path: dist/
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  github-release:
    name: Create GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: distributions
          path: dist/
      - name: Determine pre-release status
        id: status
        run: |
          case "${GITHUB_REF_NAME}" in
            *a[0-9]*|*b[0-9]*|*rc*|*-alpha*|*-beta*)
              echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac
      - name: Delete any existing release for this tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          ids=$(gh api "repos/${{ github.repository }}/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"${GITHUB_REF_NAME}\") | .id")
          for id in $ids; do
            echo "deleting release $id"
            gh api -X DELETE "repos/${{ github.repository }}/releases/$id"
          done
      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ steps.status.outputs.prerelease }}
name: Release

# Publishing is gated on validation. A tag push runs only this workflow (the CI
# workflow triggers on branches, not tags), so the `validate` job below is the
# release's own test gate. `build` needs `validate`, and `publish` needs
# `build`; therefore no platform build, test, lint, or format failure can
# result in a published artifact.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  # Signed build provenance (SLSA): the publish job attests each release
  # artifact, which requires an OIDC token and permission to write
  # attestations. Scoped to the workflow; the build job only needs contents.
  id-token: write
  attestations: write

# Never allow two releases (e.g. a tag push racing a manual dispatch) to run
# concurrently; serialize them per ref.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ------------------------------------------------------------- validate
  # The release gate. Mirrors the CI contract before anything is built or
  # published. Pure-Rust only: the release ships the no-CPython binary.
  validate:
    name: validate (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install Python (for the py feature)
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy (all features)
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: clippy (pure Rust)
        run: cargo clippy --locked --all-targets --no-default-features --features cli,repl,json,regex,time -- -D warnings
      - name: test (all features, includes py)
        run: cargo test --locked --all-targets --all-features
      - name: test (pure Rust, no Python)
        run: cargo test --locked --no-default-features --features cli,repl,json,regex,time
      - name: end-user artifact smoke (installed binary)
        run: scripts/artifact-smoke.sh --release
      - name: Release preflight (version identities, runtime artifact, tag)
        shell: bash
        # On a tag build, check the exact released version; on a manual run,
        # check the current Cargo.toml version.
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            scripts/release-preflight.sh "${GITHUB_REF_NAME#v}"
          else
            scripts/release-preflight.sh
          fi
      - name: Version and metadata consistency
        shell: bash
        run: |
          set -euo pipefail
          crate_version=$(grep -m1 '^version = ' Cargo.toml | sed -E 's/^version = "(.*)"/\1/')
          lang_version=$(grep -oE 'LANGUAGE_VERSION: &str = "[^"]+"' src/lib.rs | sed -E 's/.*"(.*)"/\1/')
          echo "release=$crate_version language=$lang_version"
          # ADR-0001: the language version must not be ahead of the release.
          if [ "$crate_version" != "$lang_version" ]; then
            # Equal is the common case; if they differ, language must be the
            # lower of the two under the same major.minor line. Compare with a
            # tiny sort check rather than a custom comparator.
            lowest=$(printf '%s\n%s\n' "$crate_version" "$lang_version" | sort -V | head -n1)
            if [ "$lowest" != "$lang_version" ]; then
              echo "LANGUAGE_VERSION ($lang_version) is ahead of release version ($crate_version)" >&2
              exit 1
            fi
          fi
          # A tagged release must have its versioned runtime directory present;
          # fail here (early) rather than in publish after a full build.
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            tag_version="${GITHUB_REF_NAME#v}"
            if [ "$tag_version" != "$crate_version" ]; then
              echo "tag v$tag_version does not match Cargo.toml version $crate_version" >&2
              exit 1
            fi
            if [ ! -f "playground/runtimes/${tag_version}/aura_playground_runtime.wasm" ]; then
              echo "missing playground/runtimes/${tag_version}/aura_playground_runtime.wasm for tag v${tag_version}" >&2
              exit 1
            fi
          fi

  # ---------------------------------------------------------------- build
  build:
    name: build ${{ matrix.target }}
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Resolve expected version
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          crate_version=$(grep -m1 '^version = ' Cargo.toml | sed -E 's/^version = "(.*)"/\1/')
          if [ -z "$crate_version" ]; then
            echo "could not read version from Cargo.toml" >&2
            exit 1
          fi
          # On a tag build, the tag must match the crate version.
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            tag_version="${GITHUB_REF_NAME#v}"
            if [ "$tag_version" != "$crate_version" ]; then
              echo "tag v$tag_version does not match Cargo.toml version $crate_version" >&2
              exit 1
            fi
          fi
          echo "version=$crate_version" >> "$GITHUB_OUTPUT"
      - name: Build pure-Rust release (no CPython)
        run: >
          cargo build --release --locked --target ${{ matrix.target }}
          --no-default-features --features cli,repl,json,regex,time
      - name: Package and verify
        shell: bash
        run: |
          set -euo pipefail
          name="aura-${{ matrix.target }}"
          if [ "${{ runner.os }}" = "Windows" ]; then
            bin="aura.exe"
          else
            bin="aura"
          fi
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/$bin" "dist/$name/"
          cp README.md LICENSE "dist/$name/"
          # Smoke-test the built executable before it is released: it must
          # report the expected version and run a program.
          expected="${{ steps.ver.outputs.version }}"
          "./dist/$name/$bin" version | grep -qx "aura $expected"
          printf 'fn main() { print("ok") }\n' > smoke.aura
          "./dist/$name/$bin" run smoke.aura | grep -qx ok
          rm -f smoke.aura
          (cd dist && tar czf "$name.tar.gz" "$name")
          # Record a checksum next to the archive, portably: macOS ships
          # `shasum -a 256`, Linux/Git-Bash ship `sha256sum`. Each target
          # writes its own file (merged artifacts must not collide).
          if command -v sha256sum >/dev/null 2>&1; then
            (cd dist && sha256sum "$name.tar.gz" > "$name.sha256")
          else
            (cd dist && shasum -a 256 "$name.tar.gz" > "$name.sha256")
          fi
          cat "dist/$name.sha256"
      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: aura-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  # -------------------------------------------------------------- publish
  publish:
    name: publish (dry-run) and create GitHub release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify tag matches the crate version
        shell: bash
        run: |
          set -euo pipefail
          crate_version=$(grep -m1 '^version = ' Cargo.toml | sed -E 's/^version = "(.*)"/\1/')
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$tag_version" != "$crate_version" ]; then
            echo "tag v$tag_version does not match Cargo.toml version $crate_version" >&2
            exit 1
          fi
      - name: crates.io publish dry-run
        run: cargo publish --locked --no-default-features --features cli,repl,json,regex,time --dry-run
      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true
      - name: Verify downloaded artifacts against their checksums
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          checks=(dist/*.sha256)
          if [ "${#checks[@]}" -eq 0 ]; then
            echo "no checksum files were downloaded; refusing to publish" >&2
            exit 1
          fi
          if command -v sha256sum >/dev/null 2>&1; then
            verifier=(sha256sum -c)
          else
            verifier=(shasum -a 256 -c)
          fi
          for f in "${checks[@]}"; do
            (cd dist && "${verifier[@]}" "$(basename "$f")")
          done
      - name: Package the Playground WebAssembly runtime
        shell: bash
        run: |
          set -euo pipefail
          # The runtime artifact is versioned and immutable. Ship the exact
          # artifact the manifest names, alongside its checksum, so the release
          # is self-describing and reproducible.
          version="${GITHUB_REF_NAME#v}"
          artifact="playground/runtimes/${version}/aura_playground_runtime.wasm"
          if [ ! -f "$artifact" ]; then
            echo "missing versioned runtime artifact: $artifact" >&2
            exit 1
          fi
          cp "$artifact" "dist/aura-playground-runtime-${version}.wasm"
          (cd dist && \
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "aura-playground-runtime-${version}.wasm" > "aura-playground-runtime-${version}.wasm.sha256"
            else
              shasum -a 256 "aura-playground-runtime-${version}.wasm" > "aura-playground-runtime-${version}.wasm.sha256"
            fi)
          cat "dist/aura-playground-runtime-${version}.wasm.sha256"
      - name: Generate the release manifest
        shell: bash
        run: |
          set -euo pipefail
          scripts/release-manifest.sh > "dist/release-manifest.json"
          cat "dist/release-manifest.json"
      - name: Generate the SBOM
        shell: bash
        run: |
          set -euo pipefail
          scripts/sbom.sh > "dist/sbom.json"
          echo "SBOM components: $(python3 -c 'import json,sys; print(len(json.load(open("dist/sbom.json"))["components"]))')"
      - name: Assemble release notes
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          notes="docs/release-notes/v${version}.md"
          if [ -f "$notes" ]; then
            cp "$notes" dist/RELEASE_NOTES.md
          else
            printf '# Aura %s\n\nSee the repository changelog.\n' "$version" > dist/RELEASE_NOTES.md
          fi
      - name: Attest build provenance (signed SLSA)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          # Signed, verifiable provenance for every shipped artifact. Consumers
          # verify with `gh attestation verify <artifact> --repo <owner/repo>`.
          subject-path: |
            dist/*.tar.gz
            dist/aura-playground-runtime-*.wasm
            dist/release-manifest.json
            dist/sbom.json
      - name: Create GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          # Curated release notes when present; otherwise generated notes.
          body_path: dist/RELEASE_NOTES.md
          # Historical artifacts are immutable: never silently overwrite a
          # released asset. A new version is the recovery path.
          overwrite_files: false
          fail_on_unmatched_files: true
          files: |
            dist/*.tar.gz
            dist/*.sha256
            dist/aura-playground-runtime-*.wasm
            dist/release-manifest.json
            dist/sbom.json

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify version matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python - <<'PY'
          import os, tomllib
          with open('pyproject.toml', 'rb') as fh:
              version = tomllib.load(fh)['project']['version']
          tag = os.environ['GITHUB_REF_NAME'].lstrip('v')
          assert version == tag, f"pyproject version {version} != tag {tag}"
          print(f"version {version} matches tag")
          PY
      - name: Build
        run: |
          python -m pip install --upgrade build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/

  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Skip unless the repository has PyPI trusted publishing configured.
          skip-existing: true

  github-release:
    name: Create GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
name: Release

# Publishing is gated on validation. A tag push runs only this workflow (the CI
# workflow triggers on branches, not tags), so the `validate` job below is the
# release's own test gate. `build` needs `validate`, and `publish` needs
# `build`; therefore no platform build, test, lint, or format failure can
# result in a published artifact.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ------------------------------------------------------------- validate
  # The release gate. Mirrors the CI contract before anything is built or
  # published. Pure-Rust only: the release ships the no-CPython binary.
  validate:
    name: validate (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Python (for the py feature)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy (all features)
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: clippy (pure Rust)
        run: cargo clippy --locked --all-targets --no-default-features --features cli,repl,json,regex,time -- -D warnings
      - name: test (all features, includes py)
        run: cargo test --locked --all-targets --all-features
      - name: test (pure Rust, no Python)
        run: cargo test --locked --no-default-features --features cli,repl,json,regex,time

  # ---------------------------------------------------------------- build
  build:
    name: build ${{ matrix.target }}
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Resolve expected version
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          crate_version=$(grep -m1 '^version = ' Cargo.toml | sed -E 's/^version = "(.*)"/\1/')
          if [ -z "$crate_version" ]; then
            echo "could not read version from Cargo.toml" >&2
            exit 1
          fi
          # On a tag build, the tag must match the crate version.
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            tag_version="${GITHUB_REF_NAME#v}"
            if [ "$tag_version" != "$crate_version" ]; then
              echo "tag v$tag_version does not match Cargo.toml version $crate_version" >&2
              exit 1
            fi
          fi
          echo "version=$crate_version" >> "$GITHUB_OUTPUT"
      - name: Build pure-Rust release (no CPython)
        run: >
          cargo build --release --locked --target ${{ matrix.target }}
          --no-default-features --features cli,repl,json,regex,time
      - name: Package and verify
        shell: bash
        run: |
          set -euo pipefail
          name="aura-${{ matrix.target }}"
          if [ "${{ runner.os }}" = "Windows" ]; then
            bin="aura.exe"
          else
            bin="aura"
          fi
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/$bin" "dist/$name/"
          cp README.md LICENSE "dist/$name/"
          # Smoke-test the built executable before it is released: it must
          # report the expected version and run a program.
          expected="${{ steps.ver.outputs.version }}"
          "./dist/$name/$bin" version | grep -qx "aura $expected"
          printf 'fn main() { print("ok") }\n' > smoke.aura
          "./dist/$name/$bin" run smoke.aura | grep -qx ok
          rm -f smoke.aura
          (cd dist && tar czf "$name.tar.gz" "$name")
          # Record a checksum next to the archive, portably: macOS ships
          # `shasum -a 256`, Linux/Git-Bash ship `sha256sum`. Each target
          # writes its own file (merged artifacts must not collide).
          if command -v sha256sum >/dev/null 2>&1; then
            (cd dist && sha256sum "$name.tar.gz" > "$name.sha256")
          else
            (cd dist && shasum -a 256 "$name.tar.gz" > "$name.sha256")
          fi
          cat "dist/$name.sha256"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: aura-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  # -------------------------------------------------------------- publish
  publish:
    name: publish (dry-run) and create GitHub release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify tag matches the crate version
        shell: bash
        run: |
          set -euo pipefail
          crate_version=$(grep -m1 '^version = ' Cargo.toml | sed -E 's/^version = "(.*)"/\1/')
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$tag_version" != "$crate_version" ]; then
            echo "tag v$tag_version does not match Cargo.toml version $crate_version" >&2
            exit 1
          fi
      - name: crates.io publish dry-run
        run: cargo publish --locked --no-default-features --features cli,repl,json,regex,time --dry-run
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Verify downloaded artifacts against their checksums
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          checks=(dist/*.sha256)
          if [ "${#checks[@]}" -eq 0 ]; then
            echo "no checksum files were downloaded; refusing to publish" >&2
            exit 1
          fi
          if command -v sha256sum >/dev/null 2>&1; then
            verifier=(sha256sum -c)
          else
            verifier=(shasum -a 256 -c)
          fi
          for f in "${checks[@]}"; do
            (cd dist && "${verifier[@]}" "$(basename "$f")")
          done
      - name: Package the Playground WebAssembly runtime
        shell: bash
        run: |
          set -euo pipefail
          # The runtime artifact is versioned and immutable. Ship the exact
          # artifact the manifest names, alongside its checksum, so the release
          # is self-describing and reproducible.
          version="${GITHUB_REF_NAME#v}"
          artifact="playground/runtimes/${version}/aura_playground_runtime.wasm"
          if [ ! -f "$artifact" ]; then
            echo "missing versioned runtime artifact: $artifact" >&2
            exit 1
          fi
          cp "$artifact" "dist/aura-playground-runtime-${version}.wasm"
          (cd dist && \
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "aura-playground-runtime-${version}.wasm" > "aura-playground-runtime-${version}.wasm.sha256"
            else
              shasum -a 256 "aura-playground-runtime-${version}.wasm" > "aura-playground-runtime-${version}.wasm.sha256"
            fi)
          cat "dist/aura-playground-runtime-${version}.wasm.sha256"
      - name: Assemble release notes
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          notes="docs/release-notes/v${version}.md"
          if [ -f "$notes" ]; then
            cp "$notes" dist/RELEASE_NOTES.md
          else
            printf '# Aura %s\n\nSee the repository changelog.\n' "$version" > dist/RELEASE_NOTES.md
          fi
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          # Curated release notes when present; otherwise generated notes.
          body_path: dist/RELEASE_NOTES.md
          # Historical artifacts are immutable: never silently overwrite a
          # released asset. A new version is the recovery path.
          overwrite_files: false
          fail_on_unmatched_files: true
          files: |
            dist/*.tar.gz
            dist/*.sha256
            dist/aura-playground-runtime-*.wasm

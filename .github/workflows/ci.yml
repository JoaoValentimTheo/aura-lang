name: CI

on:
  push:
    branches: [master, main, "rewrite/**"]
  pull_request:
    branches: [master, main, "rewrite/**"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  RUST_BACKTRACE: "1"

# Least privilege: CI only reads the repository. No job writes contents, so a
# compromised workflow step cannot push, tag, or publish.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------ fmt
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # pin, so CI, local builds, and the released artifact use one version.
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  # ------------------------------------------------------------------ lint
  clippy:
    name: clippy (all features)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      # The shipped pure-Rust build must also be lint clean.
      - run: cargo clippy --locked --all-targets --no-default-features --features cli,repl,json,regex,time -- -D warnings

  # ------------------------------------------------------------------ test
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install Python (for the py feature)
        if: runner.os != 'windows'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Default features (includes py)
        if: runner.os != 'windows'
        run: cargo test --locked --all-targets --all-features
      - name: Pure Rust, no Python
        run: cargo test --locked --all-targets --no-default-features --features cli,repl,json,regex,time
      # The hardening property suite and the permanent resource corpus run in
      # this job (they are part of `--all-targets`, but are named explicitly so
      # their integration point is visible and they are never silently dropped).
      # `test/corpus` executes every committed `tests/corpus` fixture; the
      # inventory test fails if any fixture is missing from the table.
      - name: Hardening property tests
        if: runner.os == 'ubuntu-latest'
        run: cargo test --locked --all-features --test property_hardening
      - name: Permanent resource corpus
        if: runner.os == 'ubuntu-latest'
        run: cargo test --locked --all-features --test corpus

  # ---------------------------------------------------------- cpython interop
  # The `py` feature is a distinct trust boundary with its own supported
  # CPython version policy (docs/CPYTHON_COMPATIBILITY_TARGET.md). Prove the
  # interop matrix against several CPython minor lines on Linux, and one macOS
  # line. (Windows links CPython through PyO3 but setup-python's Windows
  # interpreters are not reliably linkable by the MSVC toolchain without an
  # explicit lib path; the pure-Rust build is exercised there instead.)
  cpython-interop:
    name: cpython interop (${{ matrix.python }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.13"
          - os: macos-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install CPython ${{ matrix.python }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Point PyO3 at the selected interpreter
        shell: bash
        run: echo "PYO3_PYTHON=$(python -c 'import sys; print(sys.executable)')" >> "$GITHUB_ENV"
      - name: Interop matrix
        run: cargo test --locked --features py --test interop_matrix
      - name: Python bridge suites
        run: cargo test --locked --features py --test python

  # --------------------------------------------- cpython interop (Windows, probe)
  # ADR-0003 tracks Windows `py` support as *not claimed* until a CI leg
  # measures feasibility. This job is the measurement: it installs CPython and
  # wires `PYO3_PYTHON` plus the interpreter's `libs`/`include` directories into
  # the MSVC link environment, which `setup-python`'s Windows interpreters do
  # not do by default. It is intentionally `continue-on-error` and has no macOS
  # sibling: a failure here is evidence, not a release blocker, until it turns
  # reliably green and ADR-0003 is amended to promote Windows to TESTED.
  cpython-interop-windows-probe:
    name: cpython interop (windows feasibility probe)
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install CPython 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Wire PyO3 to the MSVC link environment
        shell: pwsh
        run: |
          $py = python -c "import sys; print(sys.executable)"
          $prefix = Split-Path $py
          "PYO3_PYTHON=$py" | Out-File -FilePath $env:GITHUB_ENV -Append
          "LIB=$prefix\libs;$env:LIB" | Out-File -FilePath $env:GITHUB_ENV -Append
          "INCLUDE=$prefix\Include;$env:INCLUDE" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Interop matrix
        run: cargo test --locked --features py --test interop_matrix
      - name: Python bridge suites
        run: cargo test --locked --features py --test python

  # -------------------------------------------------------------- no-python
  no-python:
    name: pure Rust binary links no CPython
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo build --release --locked --no-default-features --features cli,repl,json,regex,time
      - name: Verify pyo3 is absent from the dependency graph
        run: |
          if cargo tree --locked --no-default-features --features cli,repl,json,regex,time | grep -qi pyo3; then
            echo "pyo3 must not be linked without the py feature" >&2
            exit 1
          fi
      - name: End-user artifact smoke (installed binary)
        # Exercises the shipped executable end to end: version, run/check/eval,
        # stdin, modules, collections, JSON, error exit codes, the REPL, and the
        # pure-Rust `py_*` E5002 contract.
        run: scripts/artifact-smoke.sh --release

  # ------------------------------------------------------------------ MSRV
  # The declared `rust-version` must hold for the feature set that is actually
  # shipped, not just `cli`. `repl` pulls `rustyline`, whose transitive
  # `home`/`unicode-segmentation` had drifted past 1.83; the lockfile pins
  # versions that keep the shipped binary buildable on the MSRV. This job
  # deliberately uses `+1.83.0`, overriding `rust-toolchain.toml`.
  msrv:
    name: minimum supported Rust (1.83)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@1.83.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Build the shipped pure-Rust feature set on the MSRV
        run: cargo +1.83.0 check --locked --no-default-features --features cli,repl,json,regex,time

  # ---------------------------------------------------------------- proptest
  proptest:
    name: extended property tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Run property suite with many cases
        env:
          PROPTEST_CASES: "2048"
        run: cargo test --locked --test property -- --nocapture

  # --------------------------------------------------------------- contract
  contract:
    name: language contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo test --locked --test contract --test examples
      - name: Version integrity (Cargo.toml == Cargo.lock == aura::VERSION)
        run: |
          set -euo pipefail
          cargo_toml=$(grep -m1 '^version = ' Cargo.toml | sed -E 's/^version = "(.*)"/\1/')
          cargo_lock=$(awk '/^name = "aura-lang"$/{getline; print $3}' Cargo.lock | tr -d '"')
          cli=$(cargo run --quiet --locked --no-default-features --features cli -- version | awk '{print $2}')
          echo "Cargo.toml=$cargo_toml Cargo.lock=$cargo_lock cli=$cli"
          test "$cargo_toml" = "$cargo_lock"
          test "$cargo_toml" = "$cli"

  # -------------------------------------------------------------- miri (UB)
  miri:
    name: miri (unsafe-free guarantee)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo +nightly miri test --locked --lib --no-default-features --features cli

  # --------------------------------------------------------------- supply chain
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo install cargo-audit --locked || true
      - run: cargo audit

  # ------------------------------------------------------------------ fuzz
  # A bounded libFuzzer smoke run of the four hardening targets on every PR.
  # Budget: 60 s per target (240 s worst case), which is small against the
  # existing CI and catches crashes/aborts/timeouts early. The long run is the
  # nightly `fuzz-nightly` workflow. Fuzzing needs nightly; it is invoked as
  # `cargo +nightly`, overriding `rust-toolchain.toml`.
  fuzz:
    name: fuzz smoke (lexer/parser/checker/runtime)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: "fuzz -> target"
      - name: Install cargo-fuzz (pinned to the version in fuzz/README.md)
        run: |
          set -euo pipefail
          if ! cargo fuzz --version 2>/dev/null | grep -q 'cargo-fuzz 0.13.2'; then
            cargo install cargo-fuzz --version 0.13.2 --locked
          fi
          cargo fuzz --version
      - name: Seed the working corpora from the committed seeds
        run: |
          set -euo pipefail
          for t in lexer parser checker runtime; do
            mkdir -p "fuzz/corpus/$t"
            cp fuzz/seeds/$t/* "fuzz/corpus/$t/" 2>/dev/null || true
          done
      # Sanitizer scope: ASan is always on. LeakSanitizer is enabled for the
      # three front-end targets and scoped OFF only for `runtime`, where Aura's
      # documented, memory-safe Rc model legitimately does not reclaim a
      # reference cycle (LANGUAGE_SPEC.md §31.6) — a false positive, not a leak.
      # Crashes, aborts, and timeouts remain hard failures on every target.
      - name: Fuzz each target for 60 s
        run: |
          set -euo pipefail
          for t in lexer parser checker; do
            echo "=== fuzzing $t for 60s (LSan on) ==="
            cargo +nightly fuzz run "$t" -- -max_total_time=60 -rss_limit_mb=6144 -timeout=25
          done
          echo "=== fuzzing runtime for 60s (LSan scoped off: Rc-cycle retention) ==="
          ASAN_OPTIONS=detect_leaks=0 \
            cargo +nightly fuzz run runtime -- -max_total_time=60 -rss_limit_mb=6144 -timeout=25
      - name: Fail if any crash artifact was produced
        if: always()
        run: |
          set -euo pipefail
          # A crash/abort/leak artifact is any file libFuzzer writes that is not
          # a `slow-unit-*` file. A `slow-unit` is a *performance* signal (a
          # generated unit that exceeded the per-unit timeout under ASan), not a
          # crash: the runtime target can generate a genuinely slow but finite
          # program. Treating it as a crash made the smoke job nondeterministic
          # (CI-RELIABILITY-1). Crashes still fail the job on every target; the
          # aggressive detection of slow units remains in the nightly workflow.
          if [ -d fuzz/artifacts ]; then
            crashes="$(find fuzz/artifacts -type f ! -name 'slow-unit-*' -print)"
            if [ -n "$crashes" ]; then
              echo "fuzz produced crash artifacts:" >&2
              echo "$crashes" >&2
              exit 1
            fi
            slow="$(find fuzz/artifacts -type f -name 'slow-unit-*' -print)"
            if [ -n "$slow" ]; then
              echo "note: fuzz produced slow-unit signals (performance, not crashes):" >&2
              echo "$slow" >&2
            fi
          fi
          echo "no crash artifacts"

  # --------------------------------------------------------------- playground
  # Builds the real Playground wasm runtime, verifies the versioned manifest is
  # immutable and reproducible, and runs the ABI + native/wasm differential
  # suites. Browser/Worker suites run under Chromium when available.
  playground:
    name: playground (wasm runtime)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
      - name: Format the runtime crate
        run: cargo fmt --manifest-path playground/runtime/Cargo.toml --all -- --check
      - name: Lint the runtime crate
        run: cargo clippy --manifest-path playground/runtime/Cargo.toml --all-targets -- -D warnings
      - name: Test the runtime engine natively
        run: cargo test --manifest-path playground/runtime/Cargo.toml
      - name: Build the wasm runtime (compiles for wasm32-unknown-unknown)
        run: cargo build --manifest-path playground/runtime/Cargo.toml --release --target wasm32-unknown-unknown
      - name: Verify the committed immutable runtime manifest
        run: node playground/build.mjs --check
      - name: Playground ABI + differential + manifest suites
        run: node playground/tests/node/run-all.mjs

  # --------------------------------------------------------------- website
  # Builds the static website, validates every example against the real wasm
  # runtime, and checks internal links and required assets. Browser and
  # accessibility suites run under Chromium when Playwright is available.
  website:
    name: website (static build + examples + links)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
      - name: Verify the versioned runtime manifest
        run: node playground/build.mjs --check
      # The active GitHub Pages deployment is the project site, so the default
      # build must target /aura-lang/. Validate both deployment bases.
      - name: Build and validate the project-site base (/aura-lang/)
        run: |
          node website/build.mjs --base=/aura-lang/
          node website/tests/validate-examples.mjs
          node website/tests/check-links.mjs --base=/aura-lang/
          node website/tests/check-base.mjs --base=/aura-lang/
      - name: Assert no internal link bypasses the project base
        run: |
          set -euo pipefail
          stray=$(grep -rhoE '(href|src)="/[^"]*"' website/dist --include='*.html' \
            | grep -v '"/aura-lang/' || true)
          if [ -n "$stray" ]; then
            echo "internal links bypass /aura-lang/:" >&2
            echo "$stray" | sort -u >&2
            exit 1
          fi
          echo "all internal links honour /aura-lang/"
      - name: Build and validate the custom-domain base (/)
        run: |
          node website/build.mjs --base=/
          node website/tests/validate-examples.mjs
          node website/tests/check-links.mjs --base=/
          node website/tests/check-base.mjs --base=/
      - name: Default build uses the project-site base
        run: |
          node website/build.mjs
          grep -q '"/aura-lang/' website/dist/index.html
          echo "default base is /aura-lang/"

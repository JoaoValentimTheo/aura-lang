name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,examples]"

      - name: Run test suite
        run: python -m pytest tests/ -q

      - name: Run test suite with coverage (3.12 only)
        if: matrix.python-version == '3.12'
        run: python -m pytest tests/ -q --cov=aura --cov-report=term

      - name: Transpile and validate the example corpus
        run: |
          python - <<'PY'
          import ast, glob
          from aura.parser.to_ast import parse_file
          from aura.transpiler.transformer import Transformer
          from aura.transpiler.semantics import MutabilityChecker

          files = sorted(glob.glob('examples/*.aura'))
          for path in files:
              program = parse_file(path)
              checker = MutabilityChecker()
              assert checker.check_program(program), (path, checker.errors)
              ast.parse(Transformer().transform(program))
          print(f"validated {len(files)} example programs")
          PY

  cli:
    name: CLI smoke test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: pip install ".[examples]"
      - name: Run the installed `aura` command
        run: |
          aura --help
          aura run examples/hello.aura
          aura transpile examples/fibonacci.aura
          aura check examples/classes.aura
          aura test examples/hello.aura
          aura test examples/fibonacci.aura
      - name: Smoke-test the real-world examples
        run: |
          aura check examples/real/wordcount.aura
          aura check examples/real/todo_api.aura
          aura check examples/real/async_fetch.aura
          aura check examples/real/sales_pipeline.aura
          aura run examples/real/wordcount.aura examples/real/sample.txt --top 3
          aura run examples/real/todo_api.aura
          AURA_HTTP_ALLOW_PRIVATE=1 aura run examples/real/async_fetch.aura
          aura run examples/real/sales_pipeline.aura

  build:
    name: Build distributions
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade build
          python -m build
      - uses: actions/upload-artifact@v7
        with:
          name: distributions
          path: dist/

  quality:
    name: Lint and types
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff
        run: ruff check aura/
      - name: Mypy
        run: mypy aura/
name: CI

on:
  push:
    branches: [master, main, "rewrite/**"]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  RUST_BACKTRACE: "1"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------- format
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  # ------------------------------------------------------------------ lint
  clippy:
    name: clippy (all features)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --all-features -- -D warnings
      # The pure-Rust build must also be lint clean.
      - run: cargo clippy --all-targets --no-default-features --features cli -- -D warnings

  # ------------------------------------------------------------------ test
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Python (for the py feature)
        if: runner.os != 'windows'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Default features (includes py)
        if: runner.os != 'windows'
        run: cargo test --all-targets --all-features
      - name: Pure Rust, no Python
        run: cargo test --all-targets --no-default-features --features cli,repl,json,regex,time

  # -------------------------------------------------------------- no-python
  no-python:
    name: pure Rust binary links no CPython
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --no-default-features --features cli,repl,json,regex,time
      - name: Verify pyo3 is absent from the dependency graph
        run: |
          if cargo tree --no-default-features --features cli,repl,json,regex,time | grep -qi pyo3; then
            echo "pyo3 must not be linked without the py feature" >&2
            exit 1
          fi
      - name: Smoke test
        run: |
          echo 'fn main() { print("ok") }' > /tmp/smoke.aura
          ./target/release/aura run /tmp/smoke.aura | grep -qx ok

  # ------------------------------------------------------------------ MSRV
  msrv:
    name: minimum supported Rust (1.83)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.83.0
      - run: cargo check --no-default-features --features cli

  # ---------------------------------------------------------------- proptest
  proptest:
    name: extended property tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run property suite with many cases
        env:
          PROPTEST_CASES: "2048"
        run: cargo test --test property -- --nocapture

  # --------------------------------------------------------------- contract
  contract:
    name: language contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --test contract --test examples

  # -------------------------------------------------------------- miri (UB)
  miri:
    name: miri (unsafe-free guarantee)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - uses: Swatinem/rust-cache@v2
      - run: cargo miri test --lib --no-default-features --features cli

  # --------------------------------------------------------------- supply chain
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-audit --locked || true
      - run: cargo audit

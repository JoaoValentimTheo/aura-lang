name: Deploy website (GitHub Pages)

# Builds the static Aura website (including the versioned Playground runtime)
# and deploys it to GitHub Pages.
#
# GitHub Pages is the definitive website hosting platform.
#
# Deployment base. The site is served from an explicit base path, never an
# assumed one:
#
#   * GitHub Pages project site — https://joaovalentimtheo.github.io/aura-lang/
#     AURA_SITE_BASE=/aura-lang/   (this workflow)
#
# The build does NOT emit a `CNAME` file: a `CNAME` makes GitHub Pages claim
# a custom domain and 301-redirect this project URL to it, which is exactly
# what broke the public deployment before. No such domain is configured.
#
# The site is fully static: no server, no database, no remote execution. The
# Playground runs entirely in the browser.

on:
  push:
    branches: ["rewrite/**", master, main]
    paths:
      - "website/**"
      - "playground/**"
      - "docs/**"
      - "src/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build static site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      # The runtime crate must be formatted and linted like the rest of the
      # repository, and its native engine tested.
      - name: "Runtime crate: fmt"
        run: cargo fmt --manifest-path playground/runtime/Cargo.toml --all -- --check
      - name: "Runtime crate: clippy"
        run: cargo clippy --manifest-path playground/runtime/Cargo.toml --all-targets -- -D warnings
      - name: "Runtime crate: native tests"
        run: cargo test --manifest-path playground/runtime/Cargo.toml

      # Build the immutable, versioned WebAssembly runtime and verify that the
      # committed manifest still matches the artifact on disk. Website examples
      # are validated against this exact artifact.
      - name: Verify versioned runtime manifest
        run: node playground/build.mjs --check

      # The deployment base is the explicit GitHub Pages project-site base.
      - name: Build the website
        env:
          AURA_SITE_BASE: /aura-lang/
        run: |
          echo "Building website with base: $AURA_SITE_BASE"
          node website/build.mjs

      - name: Validate examples against the real runtime
        run: node website/tests/validate-examples.mjs

      - name: Validate links and required assets
        env:
          AURA_SITE_BASE: /aura-lang/
        run: |
          node website/tests/check-links.mjs
          node website/tests/check-base.mjs

      - name: Assert internal links use the deployment base
        env:
          AURA_SITE_BASE: /aura-lang/
        run: |
          set -euo pipefail
          base="${AURA_SITE_BASE}"
          # No generated HTML may reference an internal path outside the
          # project base (external URLs, fragments, and mailto are allowed).
          stray=$(grep -rhoE '(href|src)="/[^"]*"' website/dist --include='*.html' \
            | grep -v "\"${base}" || true)
          if [ -n "$stray" ]; then
            echo "internal links bypass the base ${base}:" >&2
            echo "$stray" | sort -u >&2
            exit 1
          fi
          echo "all internal links honour the base ${base}"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: website/dist

  deploy:
    name: deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

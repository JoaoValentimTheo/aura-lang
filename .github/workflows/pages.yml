name: Deploy website

# Builds the static Aura website (including the versioned Playground runtime)
# and deploys it to GitHub Pages.
#
# Deployment base. The site is served from an explicit base path, never an
# assumed one:
#
#   * GitHub Pages project site — https://<user>.github.io/aura-lang/
#     AURA_SITE_BASE=/aura-lang/   (the current, active deployment)
#   * custom domain — https://aura.lang.dev/
#     AURA_SITE_BASE=/             (for when the custom domain is configured)
#
# The `AURA_SITE_BASE` repository variable selects the target; when it is unset
# the build defaults to the project-site base. Switching to the custom domain
# is therefore a one-variable change with no source edit.
#
# Custom domain: https://aura.lang.dev is the intended public origin; the
# generator writes `CNAME` and the site's canonical URLs use it. Configuring
# the custom domain in Pages settings and DNS is a separate, deliberate step.
#
# The site is fully static: no server, no database, no remote execution. The
# Playground runs entirely in the browser.

on:
  push:
    branches: ["rewrite/**", master, main]
    paths:
      - "website/**"
      - "playground/**"
      - "docs/**"
      - "src/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build static site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # The runtime crate must be formatted and linted like the rest of the
      # repository, and its native engine tested.
      - name: "Runtime crate: fmt"
        run: cargo fmt --manifest-path playground/runtime/Cargo.toml --all -- --check
      - name: "Runtime crate: clippy"
        run: cargo clippy --manifest-path playground/runtime/Cargo.toml --all-targets -- -D warnings
      - name: "Runtime crate: native tests"
        run: cargo test --manifest-path playground/runtime/Cargo.toml

      # Build the immutable, versioned WebAssembly runtime and verify that the
      # committed manifest still matches the artifact on disk. Website examples
      # are validated against this exact artifact.
      - name: Verify versioned runtime manifest
        run: node playground/build.mjs --check

      # The deployment base is explicit: the project-site base unless the
      # AURA_SITE_BASE repository variable selects the custom-domain root.
      - name: Build the website
        env:
          AURA_SITE_BASE: ${{ vars.AURA_SITE_BASE || '/aura-lang/' }}
        run: |
          echo "Building website with base: $AURA_SITE_BASE"
          node website/build.mjs

      - name: Validate examples against the real runtime
        run: node website/tests/validate-examples.mjs

      - name: Validate links and required assets
        env:
          AURA_SITE_BASE: ${{ vars.AURA_SITE_BASE || '/aura-lang/' }}
        run: |
          node website/tests/check-links.mjs
          node website/tests/check-base.mjs

      - name: Assert internal links use the deployment base
        env:
          AURA_SITE_BASE: ${{ vars.AURA_SITE_BASE || '/aura-lang/' }}
        run: |
          set -euo pipefail
          base="${AURA_SITE_BASE}"
          if [ "$base" = "/" ]; then
            echo "custom-domain build: root-relative links are expected"
            exit 0
          fi
          # Under a project base, no generated HTML may reference an internal
          # path outside that base (external URLs, fragments, and mailto are
          # allowed).
          stray=$(grep -rhoE '(href|src)="/[^"]*"' website/dist --include='*.html' \
            | grep -v "\"${base}" || true)
          if [ -n "$stray" ]; then
            echo "internal links bypass the base ${base}:" >&2
            echo "$stray" | sort -u >&2
            exit 1
          fi
          echo "all internal links honour the base ${base}"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist

  deploy:
    name: deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aura-language"
version = "0.2.0a4"
description = "Aura: a gradually-typed language that transpiles to Python"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Aura Team" }]
keywords = ["transpiler", "language", "python", "aura"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Compilers",
    "Topic :: Software Development :: Interpreters",
]
dependencies = [
    "tomli>=2.0; python_version < '3.11'",
]

[project.urls]
Homepage = "https://github.com/JoaoValentimTheo/aura-lang"
Repository = "https://github.com/JoaoValentimTheo/aura-lang"
Documentation = "https://joaovalentimtheo.github.io/aura-lang/"
Changelog = "https://github.com/JoaoValentimTheo/aura-lang/blob/master/CHANGELOG.md"
Issues = "https://github.com/JoaoValentimTheo/aura-lang/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-timeout>=2.0",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "mypy>=1.10",
]
# Post-quantum cryptography backend. When installed, `aura.stdlib.crypto`
# prefers vetted implementations of ML-KEM (FIPS 203), ML-DSA (FIPS 204) over
# the bundled pure-Python reference backend.
pqc = ["cryptography>=44.0"]

[project.scripts]
aura = "aura.cli:main"

[tool.setuptools]
packages = [
    "aura",
    "aura.parser",
    "aura.transpiler",
    "aura.transpiler.transformers",
    "aura.stdlib",
    "aura.repl",
    "aura.tools",
    "aura.lsp",
]
py-modules = ["main"]
include-package-data = true

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".venv", "__pycache__", ".hypothesis", "tests/success_tests_aura", "tests/oop_tests", "tests/integration_tests", "tests/secure_aura_tests", "tests/speed_aura_tests", "tests/syntax_scope_tests"]
addopts = "--ignore=tests/test_ide.py --ignore=tests/test_massive_aura_files.py --ignore=tests/test_massive_aura_v2.py --ignore=tests/test_massive_generated.py --ignore=tests/test_massive_stress.py"

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["aura/parser/generated", ".venv"]

[tool.ruff.lint]
# Start from a pragmatic rule set; the codebase predates strict linting.
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = [
    "E501",   # long lines are handled by the formatter, not the linter
    "E741",   # ambiguous names (l/I) appear in math-heavy code
    "B008",   # function calls in argument defaults (dataclasses use them)
]

[tool.ruff.lint.per-file-ignores]
# The parser and transformers intentionally star-import the AST namespace.
"aura/parser/to_ast.py" = ["F403", "F405", "E701", "SIM102"]
"aura/transpiler/transformer.py" = ["F403", "F405"]
"aura/transpiler/transformers/expressions.py" = ["F403", "F405", "F811", "E701"]
"aura/transpiler/transformers/statements.py" = ["F403", "F405", "E701"]
# The stdlib package re-exports its submodules' public API.
"aura/stdlib/__init__.py" = ["F401", "F811"]
# cli.py installs runtime aliases before importing the pipeline on purpose.
"aura/cli.py" = ["E402"]
# Generator tooling is not shipped and favors compact generated code.
"aura/tools/*.py" = ["E701", "F811"]
# Nested guard clauses read better than collapsed compound conditions here.
"aura/transpiler/rules.py" = ["SIM102"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = false
# The toolchain is dynamically typed in places (AST dispatch); keep this
# advisory rather than blocking.
allow_redefinition = true
check_untyped_defs = false

[tool.coverage.run]
branch = true
source = ["aura"]
omit = [
    "aura/parser/generated/*",
    # Dev-only test-data scaffolding, never imported by the language runtime.
    "aura/tools/generate_*.py",
    "aura/tools/stochastic_aura_gen.py",
    "aura/tools/analyze_tests.py",
]

[tool.coverage.report]
show_missing = true
# Baseline floor; raised over time. The suite currently sits above 91%, so the
# floor guards against regressions rather than the old alpha-era baseline.
fail_under = 90
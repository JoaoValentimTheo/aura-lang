[package]
name = "aura-playground-runtime"
# The `0.2.0` release runtime artifact is frozen and immutable. This is the
# first development runtime on the `0.2.1` line. The `0.2.1` language contract
# differs from `0.2.0`: the builtin-name value-namespace reservation (E1009)
# rejects value bindings that collide with a builtin, which `0.2.0` accepted
# (see docs/adr/0001-release-vs-language-version.md). A runtime that carries a
# different language contract must have a different identity, so this is a new
# artifact; `0.2.0-dev.1`/`0.2.0-dev.2` remain frozen and selectable. It is a
# development pre-release, never a published release: advancing it means
# bumping this pre-release identifier, never overwriting an existing artifact,
# and never touching `runtimes/0.2.0/`.
#
# `0.2.1-dev.1` was built before the ADR-0004 parser change (structural type
# nesting counted toward the semantic AST limit). `0.2.1-dev.2` carried the
# ADR-0004 contract but predates the train-1 parser hardening. `0.2.1-dev.3`
# carried that hardening but predates the red-team re-verification fixes:
# bounded parameterized-alias expansion (was a quadratic hang), the
# parameterized-alias depth-limit bypass, and the pure-physical module-depth
# bound. Every one of these changes which programs are accepted, so
# `0.2.1-dev.4` supersedes them; the earlier artifacts are preserved on disk as
# unlisted intermediates, per the convention that only the final development
# runtime of a line is manifested.
#
# `0.2.1-dev.4` carries the train-1/re-verification checker hardening but
# predates the TD-15 diagnostic-location change (depth-limit E1015 now points
# at the offending node), which is observable in the WASM runtime's diagnostic
# output, so `0.2.1-dev.5` superseded it.
#
# `0.3.1` is the release runtime of the Keystone line. Keystone changes the
# observable language contract: List/Array/Tuple/Set/Map have distinct
# identities, Array is a fixed-length contextual type, `json_decode_as` takes a
# canonical type position, and general semicolon statement sequencing was
# removed. A runtime with a different language contract must have a different
# identity, so this is a new artifact. `0.0.2`, `0.2.0`, and `0.2.1` remain
# frozen and selectable; their bytes and identities are never touched. This
# release identity is pinned in `playground/build.mjs`; advancing the runtime
# crate later means adding a new pre-release identity and pinning 0.3.1
# permanently.
version = "0.3.1"
edition = "2021"
rust-version = "1.83"
description = "The Aura Playground WebAssembly execution wrapper: a minimal, zero-import C ABI over the real aura runtime."
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
aura-lang = { path = "../..", default-features = false, features = ["json", "regex", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

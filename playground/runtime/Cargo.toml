[package]
name = "aura-playground-runtime"
# The `0.2.0` release runtime artifact is frozen and immutable. This is the
# first development runtime on the `0.2.1` line. The `0.2.1` language contract
# differs from `0.2.0`: the builtin-name value-namespace reservation (E1009)
# rejects value bindings that collide with a builtin, which `0.2.0` accepted
# (see docs/adr/0001-release-vs-language-version.md). A runtime that carries a
# different language contract must have a different identity, so this is a new
# artifact; `0.2.0-dev.1`/`0.2.0-dev.2` remain frozen and selectable. It is a
# development pre-release, never a published release: advancing it means
# bumping this pre-release identifier, never overwriting an existing artifact,
# and never touching `runtimes/0.2.0/`.
#
# `0.2.1-dev.1` was built before the ADR-0004 parser change (structural type
# nesting counted toward the semantic AST limit). `0.2.1-dev.2` carried the
# ADR-0004 contract but predates the train-1 parser hardening. `0.2.1-dev.3`
# carried that hardening but predates the red-team re-verification fixes:
# bounded parameterized-alias expansion (was a quadratic hang), the
# parameterized-alias depth-limit bypass, and the pure-physical module-depth
# bound. Every one of these changes which programs are accepted, so
# `0.2.1-dev.4` supersedes them; the earlier artifacts are preserved on disk as
# unlisted intermediates, per the convention that only the final development
# runtime of a line is manifested.
#
# `0.2.1-dev.4` carries the train-1/re-verification checker hardening but
# predates the TD-15 diagnostic-location change (depth-limit E1015 now points
# at the offending node), which is observable in the WASM runtime's diagnostic
# output, so `0.2.1-dev.5` superseded it.
#
# `0.3.1` is the release runtime of the Keystone line. Keystone changes the
# observable language contract: List/Array/Tuple/Set/Map have distinct
# identities, Array is a fixed-length contextual type, `json_decode_as` takes a
# canonical type position, and general semicolon statement sequencing was
# removed. A runtime with a different language contract must have a different
# identity, so this is a new artifact. `0.0.2`, `0.2.0`, and `0.2.1` remain
# frozen and selectable; their bytes and identities are never touched. This
# release identity is pinned in `playground/build.mjs`; advancing the runtime
# crate later means adding a new pre-release identity and pinning 0.3.1
# permanently.
#
# `0.3.2-dev.1` is the first development runtime on the 0.3.2 line. It is a
# *host-policy* change, not a language-contract change: the Playground now
# writes standard output through a bounded-memory `OutputSink` (a full preview
# no longer fails a program with `E4020`), and it carries the additive HTTP
# foundations (outgoing headers applied, binary-safe `body_bytes`, ordered
# `header_lines`, and a reported method/body policy). Aura syntax and language
# semantics are unchanged, so `language_version` stays `0.3.1`; only the
# runtime identity advances. It is a development pre-release and is never a
# published release. `0.3.1` remains pinned and immutable.
#
# `0.3.2-dev.8` extends Host ABI 2 in place with
# `aura_session_start_project`, which lets a *virtual multi-source project*
# suspend on a Host effect. Before it, HTTP inside a multi-file project was
# silently unavailable: the Worker had to run projects on the synchronous ABI-1
# path, which cannot perform an effect at all. ABI stays at 2 because the
# addition is purely additive — every ABI-2 export keeps its meaning and
# signature, an artifact without the new export still advertises ABI 2 and
# still runs single-source sessions, and callers feature-detect the new export
# rather than compare ABI numbers. Language semantics are unchanged, so
# `language_version` stays `0.3.1`.
#
# `0.3.2-dev.9` is still an ABI-2 host-policy development runtime with no
# language-contract change: `language_version` stays `0.3.1`, every ABI-2
# export keeps its meaning, and no `src/` semantics move. It exists because
# `0.3.2-dev.8` was frozen before sixteen `src/` corrections landed, so its
# bytes enforce a checker contract the current sources no longer implement.
# Directive 006 measured the gap: `0.3.2-dev.8` resolved only 4 of 18
# documented `sort`/f-string regressions correctly, trapped on three, and
# accepted four type-soundness violations that the current checker rejects.
# Rebuilding in place would silently replace a distributed artifact, so the
# fixes ship as a new identity. `dev.9` therefore carries, relative to `dev.8`:
#   - `sort` as a total order, rejecting incomparable lists, instead of an
#     ordering that could disagree with itself;
#   - f-string exponent case, non-finite rendering, sign/zero-padding order,
#     and `:g`-free formatting parity with native;
#   - symmetric JSON decode with `E4031` for malformed input;
#   - implicit-return bodies validated against their declared return type
#     (`E3005`);
#   - `Set` element types enforced on `add`/`has`/`contains`/`remove`
#     (`E3001`);
#   - method type parameters validated, scoped, and resolved through bounds;
#   - transitive `pub use` re-export chains resolved regardless of source
#     order, with the type-parameter frame popped on the error path;
#   - every statically empty `range` treated as empty;
#   - HTTP header values encoded as ISO-8859-1 in both directions;
#   - REPL session state made incremental and gated on the `repl` feature.
# `0.3.2-dev.8` and every earlier artifact keep their bytes and stay
# selectable; `manifest.current` remains `0.3.1`.
version = "0.3.2-dev.9"
edition = "2021"
rust-version = "1.83"
description = "The Aura Playground WebAssembly execution wrapper: a minimal, zero-import C ABI over the real aura runtime."
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
aura-lang = { path = "../..", default-features = false, features = ["json", "regex", "time", "http-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

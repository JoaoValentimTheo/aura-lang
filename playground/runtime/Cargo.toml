[package]
name = "aura-playground-runtime"
# A *development* runtime version on the 0.0.2 line. The `-dev` pre-release
# identifier keeps the versioned Playground model honest: this artifact is not
# a published release and must never be confused with the frozen, immutable
# published `0.0.2` runtime. Advancing the development runtime means bumping
# this pre-release identifier (e.g. `0.0.2-dev.2`), never overwriting an
# existing artifact.
version = "0.0.2-dev"
edition = "2021"
rust-version = "1.83"
description = "The Aura Playground WebAssembly execution wrapper: a minimal, zero-import C ABI over the real aura runtime."
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
aura-lang = { path = "../..", default-features = false, features = ["json", "regex", "time"] }

[dev-dependencies]
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

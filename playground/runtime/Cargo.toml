[package]
name = "aura-playground-runtime"
version = "0.0.2"
edition = "2021"
rust-version = "1.83"
description = "The Aura Playground WebAssembly execution wrapper: a minimal, zero-import C ABI over the real aura runtime."
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
aura-lang = { path = "../..", default-features = false, features = ["json", "regex", "time"] }

[dev-dependencies]
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

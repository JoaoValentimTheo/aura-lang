[package]
name = "aura-playground-runtime"
# The public `0.2.0` runtime. This is the current release artifact, distinct
# from the frozen historical `0.0.2` and the development pre-release chain
# (`0.0.2-dev.*`). A published release artifact is immutable: advancing to a
# new release means adding a new version, never overwriting this one.
version = "0.2.0"
edition = "2021"
rust-version = "1.83"
description = "The Aura Playground WebAssembly execution wrapper: a minimal, zero-import C ABI over the real aura runtime."
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
aura-lang = { path = "../..", default-features = false, features = ["json", "regex", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

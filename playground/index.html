<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Aura Playground</title>
    <link rel="stylesheet" href="./web/style.css" />
  </head>
  <body>
    <header class="app-bar">
      <div class="brand">
        <span class="brand-mark">λ</span>
        <span class="brand-name">Aura Playground</span>
      </div>
      <div class="version-picker">
        <label for="version">Runtime</label>
        <select id="version" aria-label="Aura runtime version"></select>
      </div>
    </header>

    <main class="layout">
      <section class="pane editor-pane">
        <div class="pane-head">
          <h2>Source</h2>
          <div class="actions">
            <button id="run" class="btn primary" type="button">Run</button>
            <button id="stop" class="btn" type="button" disabled>Stop</button>
          </div>
        </div>
        <textarea id="source" spellcheck="false" autocomplete="off" aria-label="Aura source"></textarea>
        <div class="inputs">
          <div class="field">
            <label for="args">Arguments (one per line)</label>
            <textarea id="args" spellcheck="false" aria-label="Program arguments"></textarea>
          </div>
          <div class="field">
            <label for="stdin">Standard input</label>
            <textarea id="stdin" spellcheck="false" aria-label="Standard input"></textarea>
          </div>
        </div>
      </section>

      <section class="pane output-pane">
        <div class="pane-head">
          <h2>Output</h2>
          <span id="status" class="status" role="status" aria-live="polite">idle</span>
        </div>
        <pre id="stdout" class="stdout" aria-label="Standard output"></pre>
        <div class="pane-head">
          <h2>Diagnostics</h2>
        </div>
        <ul id="diagnostics" class="diagnostics" aria-label="Diagnostics"></ul>
        <div id="runtime-note" class="runtime-note" hidden></div>
      </section>
    </main>

    <script type="module" src="./web/app.js"></script>
  </body>
</html>

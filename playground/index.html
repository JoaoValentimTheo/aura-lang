<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Aura Playground</title>
    <meta
      name="description"
      content="Run Aura — the real WebAssembly runtime — in your browser, isolated in a Web Worker."
    />
    <!-- The Playground's own design system, shared with the website. -->
    <link rel="stylesheet" href="./web/workbench.css" />
    <script>
      // Apply the stored theme before first paint (same contract as the site).
      (function () {
        try {
          var t = localStorage.getItem("aura-theme");
          if (t === "light" || t === "dark") {
            document.documentElement.setAttribute("data-theme", t);
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <header class="pg-appbar">
      <a class="pg-brand" href="./" aria-label="Aura Playground home">
        <span class="pg-brand__mark" aria-hidden="true">λ</span>
        <span class="pg-brand__name">Aura Playground</span>
      </a>
      <div class="pg-appbar__actions">
        <button id="pg-theme" class="pg-iconbtn" type="button" aria-label="Switch color theme">
          Theme
        </button>
      </div>
    </header>

    <!-- The workbench markup is injected by the shared controller so this page
         and the integrated website Playground are one interface. -->
    <main class="workbench pg-main" id="workbench" data-playground></main>

    <script type="module" src="./web/app.js"></script>
  </body>
</html>
